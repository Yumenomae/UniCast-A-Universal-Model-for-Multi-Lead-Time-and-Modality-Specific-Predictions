# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: LimitArea_0_6_12_18
  - override /model: Original_Generalist
  - override /callbacks: default
  - override /trainer: ddp

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["Full Fine-tuning", "UniCast"]

seed: 12345

trainer:
  min_epochs: 10
  max_epochs: 10
  # gradient_clip_val: 1.0
  devices: 4
  num_nodes: 1
  sync_batchnorm: True
  precision: 16

model:
  _target_: src.models.UniCast.Original_Generalist_wPhy_ACSLoss.ModelInterface
  optimizer:
    lr: 1e-8

  warmup_epochs: 0
  max_epochs: 10
  warmup_start_lr: 0
  eta_min: 1e-8
  net_ckpt_path: './ckpt/UniCast_star_Generalist.ckpt'
  alpha: 0.79
  gamma: 0.95
  gradient_scale: 15

  finetuned_net:
    _target_: src.models.components.UniCast.model.UniCast
    in_img_size: [441, 845]
    patch_size: 5
    hidden_size: 192
    num_heads: [6, 12, 12, 6]
    window_size: [2, 6, 12]
    depth: [2, 4, 4, 2]
  
  decoder_only: False
    
  compile: false

data:
  batch_size: 4 # total batch size (sum of batch size per device)
  num_workers: 15
  pin_memory: True
  train_lead_times: [1, 3]
  val_lead_times: [1, 3]

callbacks:
  early_stopping:
    monitor: "val/ACSLoss_mean_over_leadtime"
    mode: "min"
    patience: 10
  model_checkpoint:
    monitor: "val/ACSLoss_mean_over_leadtime"
    mode: "min"
    save_top_k: 10
    
logger:
  wandb:
    offline: True
    project: "PhyAst_FL_Himmel_Swin"
    tags: ${tags}
    group: "LimitArea"
  aim:
    experiment: "LimitArea"
