defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - learning_rate_monitor
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/aggregate_normalized_rmse_all_ensemble_mean"
  mode: "min"
  save_last: True
  auto_insert_metric_name: False
  verbose: False

early_stopping:
  monitor: "val/aggregate_normalized_rmse_all_ensemble_mean"
  patience: 10
  mode: "min"
  min_delta: 0.

learning_rate_monitor:
  logging_interval: 'step'
  
model_summary:
  max_depth: -1
