# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: LimitArea_0_6_12_18
  - override /model: UniCast
  - override /callbacks: default
  - override /trainer: ddp

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["UniCast"]

seed: 12345

trainer:
  min_epochs: 1
  max_epochs: 100
  # gradient_clip_val: 1.0
  devices: 4
  num_nodes: 1
  sync_batchnorm: True
  precision: 16

model:
  optimizer:
    lr: 5e-4

  warmup_epochs: 1
  max_epochs: 100
  warmup_start_lr: 0
  eta_min: 1e-8

  net:
    patch_size: 5
    hidden_size: 192
    num_heads: [6, 12, 12, 6]
    window_size: [2, 6, 12]
    depth: [2, 4, 4, 2]

data:
  batch_size: 4 # total batch size (sum of batch size per device)
  num_workers: 15
  pin_memory: True
  train_lead_times: [1, 3, 6, 12]
  val_lead_times: [6, 12, 24, 48]

logger:
  wandb:
    offline: True
    project: "UniCast"
    tags: ${tags}
    group: "LimitArea"
  aim:
    experiment: "LimitArea"
