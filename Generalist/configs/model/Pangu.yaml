_target_: src.models.Autoregress_module.ModelInterface

warmup_epochs: 1
max_epochs: 100
warmup_start_lr: 0
eta_min: 1e-8

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5e-4
  betas: [0.9, 0.95]
  weight_decay: 1e-5

scheduler:
  _target_: src.utils.lr_scheduler.LinearWarmupCosineAnnealingLR
  _partial_: true

net:
  _target_: src.models.components.Pangu.model.Pangu
  img_size: [441, 845]
  patch_size: [2, 4, 4]
  embed_dim: 192
  num_heads: [6, 12, 12, 6]
  window_size: [2, 6, 12]
  landtype_root: './data/landtype.npy'
