_target_: src.models.Stormer_module.ModelInterface

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5e-4
  betas: [0.9, 0.95]
  weight_decay: 1e-5

scheduler:
  _target_: src.utils.lr_scheduler.LinearWarmupCosineAnnealingLR
  _partial_: true
  
warmup_epochs: 10 # specify after setting train_dataloader
max_epochs: 100 # specify after setting train_dataloader
warmup_start_lr: 1e-8
eta_min: 1e-8

net:
