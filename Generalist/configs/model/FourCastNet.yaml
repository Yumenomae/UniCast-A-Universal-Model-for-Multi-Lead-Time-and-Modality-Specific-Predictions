_target_: src.models.Autoregress_module.ModelInterface

warmup_epochs: 1
max_epochs: 100
warmup_start_lr: 0
eta_min: 1e-8

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5e-4
  betas: [0.9, 0.95]
  weight_decay: 1e-5

scheduler:
  _target_: src.utils.lr_scheduler.LinearWarmupCosineAnnealingLR
  _partial_: true

net:
  _target_: src.models.components.FourCastNet.model.AFNONet
  img_size: [441, 845]
  patch_size: [5, 5]
  in_chans: 73
  out_chans: 73
  embed_dim: 768
  depth: 12
  num_blocks: 16
