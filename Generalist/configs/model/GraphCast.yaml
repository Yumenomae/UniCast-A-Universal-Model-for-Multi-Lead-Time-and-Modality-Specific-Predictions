_target_: src.models.Autoregress_module.ModelInterface

warmup_epochs: 1
max_epochs: 100
warmup_start_lr: 0
eta_min: 1e-8

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5e-4
  betas: [0.9, 0.95]
  weight_decay: 1e-5

scheduler:
  _target_: src.utils.lr_scheduler.LinearWarmupCosineAnnealingLR
  _partial_: true

net:
  _target_: src.models.components.GraphCast.model.GraphCast
  graph: "hierarchical"
  hidden_dim: 256
  hidden_layers: 1
  processor_layers: 8
  grid_dim: 73